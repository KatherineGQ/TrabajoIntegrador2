<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="img/logo.jpeg" alt="Logo">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="alta.html">Nuevo Producto</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
        <div class="busqueda-container">
            <form action="#" method="get">
                <input type="text" placeholder="Buscar productos" required>
                <button type="submit">Buscar</button>
            </form>
        </div>
    </header>
   <main>
    <section class="form-container">
        <h1>Nuevo producto</h1>
        <form id="form-alta" action="#" method="post">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" name="stock" min="0" required>
            </div>
            <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" id="marca" name="marca" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" name="categoria" required>
            </div>
            <div class="form-group">
                <label for="desc-corta">Descripción corta</label>
                <input type="text" id="desc-corta" name="desc-corta" required>
            </div>
            <div class="form-group">
                <label for="desc-larga">Descripción larga</label>
                <textarea id="desc-larga" name="desc-larga" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="envio">Envío sin cargo</label>
                <select id="envio" name="envio" required>
                    <option value="">Seleccione</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edad-desde">Edad desde</label>
                <input type="number" id="edad-desde" name="edad-desde" required>
            </div>
              <div class="form-group">
                <label for="edad-hasta">Edad hasta</label>
                <input type="number" id="edad-hasta" name="edad-hasta" required>
            </div>
              <div class="form-group">
                <label for="foto">Foto del producto</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>
            <button type="submit" class="btn-enviar">Guardar Producto</button>
        </form>
    </section>
   </main>
    <footer>
        <div class="footer-contenido">
            <p>&copy;2026 AURA NEU.</p>
            <p>Proyecto Integrador desde una mirada neurodivergente.</p>

        </div>
    </footer>
<script src="js/main.js"></script>
</body>
</html>
