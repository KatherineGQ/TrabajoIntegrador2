<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA NEU - Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="img/logo.jpeg" alt="Logo AURA NEU">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="alta.html">Nuevo Producto</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
        <div class="header-acciones">
            <div class="busqueda-container">
                <form action="#" method="get">
                    <input type="text" placeholder="Buscar productos">
                    <button type="submit">Buscar</button>
                </form>
            </div>
            <button class="btn-carrito btn-abrir-carrito" title="Ver carrito">
                🛒 Carrito <span class="badge-carrito">0</span>
            </button>
        </div>
    </header>

    <main>
        <section class="form-container">
            <h1>Contacto</h1>
            <form id="form-contacto">
                <div class="form-group">
                    <label for="nombre-contacto">Nombre:</label>
                    <input type="text" id="nombre-contacto" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email-contacto">E-mail:</label>
                    <input type="email" id="email-contacto" name="email" required>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <!-- Modal Drawer del Carrito -->
    <div id="modal-carrito" class="modal-overlay">
        <div class="carrito-drawer">
            <div class="carrito-header">
                <h2>Carrito de Compras</h2>
                <button id="btn-cerrar-carrito" class="btn-cerrar-carrito">&times;</button>
            </div>
            <div id="carrito-items-lista" class="carrito-items"></div>
            <div class="carrito-footer">
                <div class="carrito-total-fila">
                    <span>Total:</span>
                    <span id="carrito-total-monto">$0</span>
                </div>
                <button id="btn-checkout" class="btn-checkout">Finalizar Compra / Enviar Pedido</button>
                <button id="btn-vaciar-carrito" class="btn-vaciar-carrito">Vaciar Carrito</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-contenido">
            <p>&copy;2026 AURA NEU.</p>
            <p>Proyecto Integrador desde una mirada neurodivergente.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
